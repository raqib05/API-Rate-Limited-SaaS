version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: gatekeeper-postgres
    environment:
      POSTGRES_DB: gatekeeper
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: gatekeeper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: gatekeeper-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
